# Full stack: builds wiedehopf/readsb from source alongside this daemon, so
# `docker compose -f docker-compose.full.yml up -d` goes from a USB RTL-SDR
# dongle to published AT Protocol sightings with no separately-managed readsb
# install.
#
# Prerequisite: clone readsb as a sibling directory of this repo first:
#   git clone https://github.com/wiedehopf/readsb.git ../readsb
#
# For a readsb instance you already run yourself, use docker-compose.yml
# instead and point READSB_URL at it. (This file intentionally does not read
# READSB_URL from .env: that variable's documented default in .env.example
# is host.docker.internal, for the other file's separately-run-readsb case.
# Here readsb is a service in this same compose project, so the adapter is
# pointed at it directly.)
#
# Notes:
# - devices: /dev/bus/usb needs a Linux Docker host; if the dongle is
#   unplugged/replugged, restart the readsb container to reclaim it. Make
#   sure the kernel's dvb_usb_rtl28xxu driver isn't holding the device.
# - Ports 8080 and 30001-30005 will collide with any readsb/dump1090/tar1090
#   already running on the host.
# - This file's daemon/adapter-readsb service names match docker-compose.yml,
#   so the two share the same socket/atrx-tmp/queue-data volumes. But
#   `docker compose down` (without -f docker-compose.full.yml) only stops
#   daemon/adapter-readsb and leaves readsb/proxy running as orphans.
# - Public exposure of the WebSocket stream (docs/HOSTING.md#exposing-your-station-publicly)
#   is the optional `cloudflared` service below, rather than the host-installed
#   Caddy + open ports 80/443 approach in that guide — it needs no inbound
#   ports and works behind CGNAT, at the cost of routing through Cloudflare.
services:
  # --- Decoder: wiedehopf/readsb, reads a USB RTL-SDR dongle and writes
  # aircraft.json/stats.json to a shared volume. ---
  readsb:
    build:
      context: ../readsb
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command:
      - --device-type=rtlsdr
      - --quiet
      - --gain=auto
      - --lat=${RECEIVER_LAT:-38.8977}
      - --lon=${RECEIVER_LON:--77.0365}
      - --net
      - --net-ri-port=30001
      - --net-ro-port=30002
      - --net-sbs-port=30003
      - --net-bi-port=30004
      - --net-bo-port=30005
      - --write-json=/run/readsb
      - --write-json-every=1
      - --json-location-accuracy=2
    volumes:
      - readsb-data:/run/readsb
    ports:
      # Beast/raw/SBS TCP ports opened by the explicit --net-*-port flags above (useful for other tools, e.g. feeding another aggregator)
      - "30001:30001" # raw input
      - "30002:30002" # raw output
      - "30003:30003" # SBS output
      - "30004:30004" # beast input
      - "30005:30005" # beast output

  # --- Caddy: serves readsb's aircraft.json/stats.json over HTTP at /data/,
  # which is what the readsb adapter below polls. Also the natural place to
  # add more routes/TLS later; see Caddyfile. ---
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - readsb-data:/srv/readsb-data/data:ro
    ports:
      - "8080:80"
    depends_on:
      - readsb

  daemon:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["run", "--socket-path", "/run/at-adsb/daemon.sock", "--atrx-temp-dir", "/tmp/at-adsb-atrx"]
    env_file: .env
    ports:
      - "${WS_PORT:-4100}:4100"
    volumes:
      - socket:/run/at-adsb
      - atrx-tmp:/tmp/at-adsb-atrx
      - queue-data:/data
    restart: unless-stopped

  adapter-readsb:
    build:
      context: .
      dockerfile: server/Dockerfile
    command:
      - "adapter"
      - "readsb"
      - "--socket"
      - "/run/at-adsb/daemon.sock"
      - "--url"
      - "http://proxy:80"
      - "--source-id"
      - "readsb-1090"
      - "--poll-interval"
      - "${POLL_INTERVAL_S:-5}"
      - "--batch-window"
      - "${BATCH_WINDOW_S:-15}"
      - "--atrx-temp-dir"
      - "/tmp/at-adsb-atrx"
      # Uncomment to enable raw BEAST frame capture:
      # - "--beast-host"
      # - "${BEAST_HOST:-readsb}"
      # - "--beast-port"
      # - "${BEAST_PORT:-30005}"
    env_file: .env
    volumes:
      - socket:/run/at-adsb
      - atrx-tmp:/tmp/at-adsb-atrx
    depends_on:
      - daemon
      - proxy
    restart: unless-stopped

  # Optional: expose the daemon's WebSocket event stream
  # (at.adsb.broadcast.subscribeEvents) publicly via Cloudflare Tunnel, so
  # relays/aggregators can subscribe without polling. No inbound ports to
  # open, no DNS/TLS to manage yourself — Cloudflare terminates TLS at their
  # edge and cloudflared makes an outbound-only connection from here.
  #
  # Setup: create a tunnel in the Cloudflare Zero Trust dashboard
  # (Networks > Tunnels), add a public hostname pointing to http://daemon:4100,
  # copy the tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN, then set
  # STREAM_ENDPOINT in .env to wss://<your-hostname>/xrpc/at.adsb.broadcast.subscribeEvents
  # (see docs/HOSTING.md#exposing-your-station-publicly and
  # https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/).
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - daemon

volumes:
  readsb-data:
  socket:
  atrx-tmp:
  queue-data:
